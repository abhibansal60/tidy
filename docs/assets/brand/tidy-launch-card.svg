ystem-ui, sans-serif" font-weight="700" font-size="54" fill="#F5F7FA">and YouTube. You stay</text><text x="110" y="500" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="54" fill="#F5F7FA">in charge.</text><text x="110" y="600" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="40" fill="#3DDC97">About 45 cents to sort 12,158 emails</text><rect x="110" y="680" width="620" height="96" rx="20" fill="#1A2A24" stroke="#3DDC97" stroke-width="3"/><text x="140" y="742" text-anchor="start" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="40" fill="#F5F7FA">$ pipx install tidy-ai</text></svg>
