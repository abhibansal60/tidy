<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Tidy</title><rect width="1600" height="900" fill="#0F1A16"/><g transform="translate(990 210) scale(1.0) translate(-30 -33)"><g stroke="#0E2A20" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="256" cy="436" rx="150" ry="14" fill="#000" fill-opacity=".12" stroke="none"/><path d="M86 118 l6 -18 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 z" fill="#F4C542" stroke-width="5"/><line x1="428" y1="196" x2="468" y2="420" stroke="#8B5E3C" stroke-width="14"/><path d="M438 408 L498 398 L512 470 L444 482 Z" fill="#F4C542"/><path d="M458 420 L468 474 M478 416 L488 470" stroke-width="5"/><line x1="256" y1="150" x2="256" y2="104"/><path d="M256 70 l7 20 l20 7 l-20 7 l-7 20 l-7 -20 l-20 -7 l20 -7 z" fill="#F4C542" stroke-width="6"/><ellipse cx="206" cy="412" rx="34" ry="16" fill="#1E8F5E"/><ellipse cx="306" cy="412" rx="34" ry="16" fill="#1E8F5E"/><rect x="96" y="150" width="320" height="252" rx="60" fill="#3DDC97"/><circle cx="86" cy="300" r="20" fill="#3DDC97"/><circle cx="440" cy="298" r="20" fill="#3DDC97"/><ellipse cx="206" cy="312" rx="22" ry="27" fill="#0E2A20"/><ellipse cx="306" cy="312" rx="22" ry="27" fill="#0E2A20"/><circle cx="214" cy="301" r="8" fill="#fff" stroke="none"/><circle cx="314" cy="301" r="8" fill="#fff" stroke="none"/><ellipse cx="164" cy="346" rx="22" ry="12" fill="#FF8FA3" fill-opacity=".8" stroke="none"/><ellipse cx="348" cy="346" rx="22" ry="12" fill="#FF8FA3" fill-opacity=".8" stroke="none"/><path d="M232 344 Q256 368 280 344" fill="none" stroke-width="9"/></g></g><text x="110" y="210" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="76" fill="#F5F7FA">AI reads it.</text><text x="110" y="300" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="76" fill="#3DDC97">Code decides.</text><text x="110" y="380" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="32" fill="#B7C2BC">The AI in Tidy never touches your account.</text><text x="110" y="422" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="32" fill="#B7C2BC">Plain code does that, with caps and a live recheck.</text><text x="110" y="500" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#F5F7FA">Gmail cleanup  ·  YouTube subscriptions  ·  MIT licensed</text><text x="110" y="545" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" fill="#F5F7FA">Open source, security-reviewed, Python 3.11 to 3.14</text><rect x="110" y="640" width="660" height="100" rx="20" fill="#1A2A24" stroke="#3DDC97" stroke-width="3"/><text x="140" y="704" text-anchor="start" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="42" fill="#F5F7FA">$ pipx install tidy-ai</text><text x="110" y="800" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="28" fill="#7C8983">github.com/abhibansal60/tidy</text></svg>
